# ============================================================
# PRODUCTION PROFILE - PostgreSQL
# All sensitive values must be set as environment variables
# on the server. The app will refuse to start if they are missing.
# ============================================================

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# DDL - use 'validate' in prod so Hibernate never alters the schema automatically.
# Schema is managed manually (or via init SQL on first deploy).
spring.jpa.hibernate.ddl-auto=update

# Disable H2 console in production
spring.h2.console.enabled=false

# Initial admin account - must be set as environment variables
app.seed.admin.email=${SEED_ADMIN_EMAIL}
app.seed.admin.password=${SEED_ADMIN_PASSWORD}
app.seed.admin.firstName=${SEED_ADMIN_FIRST_NAME}
app.seed.admin.lastName=${SEED_ADMIN_LAST_NAME}

# Upload storage - absolute path on the server
app.upload.dir=${UPLOAD_DIR}
app.upload.max-bytes=52428800

# Connection pool tuning for A1 Flex (12 GB RAM)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000

# Do not expose internal error details
server.error.include-stacktrace=never
server.error.include-message=never

# Session cookie security (HTTPS only)
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict


